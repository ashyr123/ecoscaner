<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EcoScaner Admin</title>
<style>
  :root {
    --bg: #0f1117;
    --card: #1a1d27;
    --border: #2a2d3e;
    --green: #2ecc71;
    --green2: #27ae60;
    --text: #e8eaf0;
    --muted: #8b8fa8;
    --accent: #3498db;
    --danger: #e74c3c;
    --warning: #f39c12;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: var(--bg); color: var(--text); font-family: "Segoe UI", sans-serif; display: flex; min-height: 100vh; }
  .sidebar { width: 240px; background: var(--card); border-right: 1px solid var(--border); padding: 24px 0; display: flex; flex-direction: column; position: fixed; height: 100vh; }
  .logo { padding: 0 24px 24px; border-bottom: 1px solid var(--border); margin-bottom: 16px; }
  .logo h2 { color: var(--green); font-size: 20px; }
  .logo span { color: var(--muted); font-size: 12px; }
  .nav a { display: flex; align-items: center; gap: 12px; padding: 12px 24px; color: var(--muted); text-decoration: none; transition: all 0.2s; font-size: 14px; }
  .nav a:hover, .nav a.active { color: var(--text); background: rgba(46,204,113,0.08); border-right: 3px solid var(--green); }
  .nav a .icon { font-size: 18px; width: 20px; }
  .nav-bottom { margin-top: auto; padding-top: 16px; border-top: 1px solid var(--border); }
  .main { margin-left: 240px; flex: 1; padding: 32px; }
  .page-title { font-size: 24px; font-weight: 700; margin-bottom: 8px; }
  .page-sub { color: var(--muted); font-size: 14px; margin-bottom: 32px; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 24px; }
  .cards-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; margin-bottom: 24px; }
  .stat-card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 24px; }
  .stat-card .label { color: var(--muted); font-size: 13px; margin-bottom: 8px; }
  .stat-card .value { font-size: 32px; font-weight: 700; }
  .stat-card .sub { color: var(--muted); font-size: 12px; margin-top: 4px; }
  .stat-card.green .value { color: var(--green); }
  .stat-card.blue .value { color: var(--accent); }
  .stat-card.yellow .value { color: var(--warning); }
  .stat-card.red .value { color: var(--danger); }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th { color: var(--muted); font-weight: 600; padding: 12px 16px; text-align: left; border-bottom: 1px solid var(--border); }
  td { padding: 12px 16px; border-bottom: 1px solid rgba(255,255,255,0.04); }
  tr:hover td { background: rgba(255,255,255,0.02); }
  .badge { display: inline-block; padding: 2px 10px; border-radius: 20px; font-size: 12px; font-weight: 600; }
  .badge-green { background: rgba(46,204,113,0.15); color: var(--green); }
  .badge-blue { background: rgba(52,152,219,0.15); color: var(--accent); }
  .search-bar { display: flex; gap: 12px; margin-bottom: 20px; }
  .search-bar input { flex: 1; background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 10px 16px; color: var(--text); font-size: 14px; outline: none; }
  .search-bar input:focus { border-color: var(--green); }
  .search-bar button { background: var(--green); color: #fff; border: none; border-radius: 8px; padding: 10px 20px; cursor: pointer; font-size: 14px; font-weight: 600; }
  .section-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
  .section-header h3 { font-size: 16px; font-weight: 600; }
  .login-wrap { display: flex; align-items: center; justify-content: center; min-height: 100vh; width: 100%; }
  .login-card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 40px; width: 360px; }
  .login-card h1 { color: var(--green); font-size: 22px; margin-bottom: 4px; }
  .login-card p { color: var(--muted); font-size: 13px; margin-bottom: 28px; }
  .form-group { margin-bottom: 16px; }
  .form-group label { display: block; color: var(--muted); font-size: 13px; margin-bottom: 8px; }
  .form-group input { width: 100%; background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 12px 16px; color: var(--text); font-size: 14px; outline: none; }
  .form-group input:focus { border-color: var(--green); }
  .btn-primary { width: 100%; background: var(--green); color: #fff; border: none; border-radius: 8px; padding: 12px; font-size: 15px; font-weight: 600; cursor: pointer; }
  .btn-primary:hover { background: var(--green2); }
  .error { background: rgba(231,76,60,0.1); border: 1px solid rgba(231,76,60,0.3); color: var(--danger); border-radius: 8px; padding: 10px 14px; font-size: 13px; margin-bottom: 16px; }
  .grid-2 { display: grid; grid-template-columns: 2fr 1fr; gap: 20px; }
</style>
</head>
<body>
{% block body %}{% endblock %}
</body>
</html>
